<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Optimizer</title>
<link rel="icon" href="/favicon.ico">
<style>
:root {
  --bg: #f5f2ed;
  --surface: #ffffff;
  --surface2: #f0ece6;
  --border: #d9d3cb;
  --text: #3d3833;
  --text2: #8a8580;
  --accent: #588b8b;
  --accent2: #4a7a7a;
  --green: #7a9e7e;
  --red: #c96b6b;
  --yellow: #d4a85c;
  --radius: 8px;
  --shadow: 0 1px 6px rgba(0,0,0,.08);
}
/* Dark palette. accent/green/red/yellow stay identical across themes so the
   brand color and status colors read the same; only the neutral surfaces and
   text flip. Applied via data-theme="dark" (manual toggle) OR, when the user
   hasn't explicitly chosen a theme (no data-theme attribute), via the OS
   prefers-color-scheme media query below. */
:root[data-theme="dark"] {
  --bg: #1e1c1a;
  --surface: #2a2724;
  --surface2: #332f2b;
  --border: #413b35;
  --text: #e8e3dc;
  --text2: #9a938b;
  --shadow: 0 1px 6px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #1e1c1a;
    --surface: #2a2724;
    --surface2: #332f2b;
    --border: #413b35;
    --text: #e8e3dc;
    --text2: #9a938b;
    --shadow: 0 1px 6px rgba(0,0,0,.4);
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Header */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 { font-size: 20px; font-weight: 700; }
header h1 span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text2); }
.status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px;
}
.status-dot.ok { background: var(--green); }
.status-dot.warn { background: var(--yellow); }
.status-dot.err { background: var(--red); }
.theme-toggle {
  background: var(--bg); border: 1px solid var(--border); color: var(--text2);
  border-radius: var(--radius); cursor: pointer; padding: 6px 10px; font-size: 15px;
  line-height: 1; transition: all .15s;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--text); }

#notice-container {
  position: fixed; top: 16px; right: 16px; z-index: 1000;
  display: flex; flex-direction: column; gap: 8px; max-width: 380px;
}
.notice {
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--text2);
  border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow);
  font-size: 13px; color: var(--text); display: flex; align-items: flex-start; gap: 10px;
  animation: notice-in .2s ease-out;
}
.notice.err { border-left-color: var(--red); }
.notice.ok { border-left-color: var(--green); }
.notice.info { border-left-color: var(--accent); }
.notice-msg { flex: 1; }
.notice-close { cursor: pointer; color: var(--text2); font-size: 16px; line-height: 1; background: none; border: none; padding: 0; }
.notice-close:hover { color: var(--text); }
@keyframes notice-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

.recent-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 12px; }
.recent-chips:empty { margin: 0; }
.recent-chip {
  font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  background: var(--bg); border: 1px solid var(--border); color: var(--text2);
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: all .15s;
}
.recent-chip:hover { border-color: var(--accent); color: var(--text); background: var(--surface); }

/* Main Layout */
.container {
  max-width: 1400px; margin: 0 auto; padding: 20px 24px;
  display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start;
}
.app-sidebar {
  display: flex; flex-direction: column; gap: 20px; position: sticky; top: 20px;
  max-height: calc(100vh - 40px); overflow-y: auto;
}
.app-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (max-width: 1000px) {
  .container { display: flex; flex-direction: column; }
  .app-sidebar { position: static; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.card-title {
  font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text2); margin-bottom: 14px;
}

/* Input Section */
.input-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.input-row input[type="text"] {
  flex: 1 1 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none;
  transition: border-color .2s;
}
.input-row input[type="text"]:focus { border-color: var(--accent); }
.btn {
  padding: 10px 20px; border: none; border-radius: var(--radius); cursor: pointer;
  font-size: 14px; font-weight: 500; transition: all .2s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: var(--accent2); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: .8; }

/* Config */
.config-grid { display: flex; gap: 24px; flex-wrap: wrap; }
.config-group { display: flex; flex-direction: column; gap: 6px; }
.config-group label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.config-group select, .config-group input[type="number"] {
  padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none;
  min-width: 140px;
}
.config-group select:focus, .config-group input:focus { border-color: var(--accent); }
.config-group input[type="text"] {
  padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none;
  min-width: 180px;
}
.config-group.disabled-group { opacity: .45; }
.radio-group { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius); padding: 3px; }
.radio-group label {
  padding: 6px 16px; border-radius: 5px; cursor: pointer; font-size: 13px;
  color: var(--text2); transition: all .2s; user-select: none;
}
.radio-group input { display: none; }
.radio-group input:checked + label { background: var(--accent); color: #000; font-weight: 500; }
.check-row {
  display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;
  user-select: none; padding: 8px 0;
}

/* File List */
.file-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--text2); }
.file-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
  max-height: 360px; overflow-y: auto; align-items: start;
}
.file-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px; cursor: pointer; transition: all .2s;
}
.file-card:hover { border-color: var(--accent); }
.file-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
/* .fc-main wraps everything that isn't the (optional) override panel, and
   is the positioning context for the check/gear/preview-btn overlays —
   scoping them here (instead of to .file-card) means opening the override
   panel below can never cover them, since they're absolutely positioned
   relative to this box, not the taller card. */
.file-card .fc-main { position: relative; }
.file-card .thumb {
  width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px;
  background: #222; display: block;
}
.file-card .fname {
  font-size: 12px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.file-card .fsize { font-size: 11px; color: var(--text2); }
.file-card .check {
  position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
  border-radius: 50%; background: rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: transparent; transition: all .2s;
}
.file-card.selected .check { background: var(--accent); border-color: var(--accent); color: #000; }
.file-card .preview-btn {
  position: absolute; bottom: 4px; right: 4px;
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--card); color: var(--text2);
  cursor: pointer; white-space: nowrap; max-width: calc(100% - 12px);
  overflow: hidden; text-overflow: ellipsis; transition: opacity .15s;
  opacity: 0;
}
.file-card:hover .preview-btn, .file-card .preview-btn:not(:disabled) { opacity: .9; }
.file-card .preview-btn:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
.file-card .preview-btn:disabled { cursor: default; opacity: .8; }
.file-card .card-gear {
  position: absolute; top: 4px; left: 4px;
  font-size: 12px; width: 20px; height: 20px; line-height: 18px;
  border-radius: 50%; border: 1px solid var(--border); background: rgba(0,0,0,.5);
  color: var(--text2); cursor: pointer; padding: 0; opacity: 0; transition: opacity .15s;
}
.file-card:hover .card-gear { opacity: .85; }
.file-card .card-gear:hover { opacity: 1; color: var(--accent); border-color: var(--accent); }
.file-card.has-override .card-gear { opacity: 1; color: var(--accent); border-color: var(--accent); }
/* Normal-flow block below .fc-main (not an absolute overlay) — opening it
   grows the card's own height instead of covering fsize/preview-btn, which
   both live inside .fc-main above it. */
.file-card .file-override {
  margin-top: 6px; border-top: 1px solid var(--border);
  padding-top: 4px; font-size: 10px; display: flex; flex-direction: column; gap: 2px;
}
.file-card .fo-row { display: flex; align-items: center; gap: 4px; }
.file-card .fo-label { width: 42px; color: var(--text2); flex-shrink: 0; }
.file-card .fo-row select, .file-card .fo-row input {
  flex: 1; min-width: 0; font-size: 10px; padding: 1px 2px;
  background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px;
}
.file-list-empty {
  text-align: center; padding: 30px; color: var(--text2); white-space: nowrap;
}

/* Progress */
.progress-bar {
  height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 12px;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--green));
  border-radius: 3px; transition: width .3s; width: 0%;
}
.progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 10px; }
.log-box {
  background: var(--bg); border-radius: var(--radius); padding: 12px 16px;
  max-height: 240px; overflow-y: auto; font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
  font-size: 12px; line-height: 1.7;
}
.log-entry { color: var(--text2); }
.log-entry.ok { color: var(--green); }
.log-entry.err { color: var(--red); }
.log-entry.info { color: var(--accent); }

/* Results */
.result-summary {
  display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap;
}
.result-toolbar {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px;
}
.result-toolbar label { font-size: 12px; color: var(--text2); }
.result-toolbar select {
  padding: 6px 10px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none;
}
.result-toolbar select:focus { border-color: var(--accent); }
.result-toolbar .count { font-size: 12px; color: var(--text2); margin-left: auto; }
.result-stat { text-align: center; min-width: 100px; }
.result-stat .value { font-size: 24px; font-weight: 700; }
.result-stat .value.green { color: var(--green); }
.result-stat .value.accent { color: var(--accent); }
.result-stat .label { font-size: 12px; color: var(--text2); margin-top: 2px; }

.result-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
  max-height: 400px; overflow-y: auto;
}
.result-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px; transition: all .2s;
}
.result-card:hover { border-color: var(--accent); }
.result-card .thumb {
  width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px;
  background: #222; display: block;
}
.result-card .rname { font-size: 12px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-card .rstats { font-size: 11px; color: var(--text2); margin-top: 2px; }
.result-card .rsaved { font-size: 13px; font-weight: 600; color: var(--green); margin-top: 4px; }
.result-card .compare-btn {
  display: inline-block; margin-top: 6px; padding: 4px 12px; font-size: 11px;
  background: var(--surface2); color: var(--accent); border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; text-decoration: none; transition: all .2s;
}
.result-card .compare-btn:hover { background: var(--border); }

/* Sections visibility */
.section { display: none; }
.section.active { display: block; }

/* Action bar */
.action-bar { display: flex; gap: 10px; align-items: center; }
.action-bar .btn { flex-shrink: 0; }
.action-bar .spacer { flex: 1; }

/* Responsive */
@media (max-width: 640px) {
  .container { padding: 12px; }
  .input-row { flex-direction: column; }
  .config-grid { flex-direction: column; }
  .file-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
}
</style>
</head>
<body>

<header>
  <h1 style="display:flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="20" width="216" height="216" rx="34" fill="#588b8b"/><path d="M64 176 L118 106 L152 142 L184 96 L216 176 Z" fill="#f5f2ed"/><circle cx="86" cy="80" r="18" fill="#f5f2ed"/></svg>Image Optimizer</h1>
  <div class="header-right">
    <span id="health-status"><span class="status-dot warn"></span>Checking...</span>
    <span id="workspace-info"></span>
    <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle theme"></button>
  </div>
</header>

<div id="notice-container"></div>

<div class="container">

  <div class="app-sidebar">

  <!-- Input Section -->
  <div class="card" id="input-section">
    <div class="card-title">Select Images</div>
    <div class="input-row">
      <input type="text" id="dir-path" placeholder="Folder path to scan, e.g. D:\screenshots" />
      <button class="btn btn-primary" id="scan-btn">Scan Folder</button>
      <button class="btn btn-secondary" id="browse-folder-btn">Browse Folder...</button>
      <button class="btn btn-secondary" id="browse-files-btn">Browse Files...</button>
    </div>
    <div class="recent-chips" id="recent-scan-dirs"></div>
    <div id="scan-progress-wrap" style="display:none;margin-bottom:12px">
      <div class="progress-bar" style="margin-bottom:6px"><div class="progress-bar-fill" id="scan-progress-fill"></div></div>
      <div style="font-size:12px;color:var(--text2)" id="scan-progress-text"></div>
    </div>
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:13px">
      <label style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px">
        <input type="checkbox" id="recursive-scan" /> Include subfolders
      </label>
    </div>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/bmp,image/tiff,image/webp" multiple style="display:none" />
  </div>

  <!-- Output Path -->
  <div class="card" id="output-section">
    <div class="card-title">Output Path (optional)</div>
    <div class="input-row">
      <input type="text" id="output-dir" placeholder="Type or paste the output folder path, or leave empty for temp folder" />
      <button class="btn btn-secondary" id="output-browse-btn">Browse Folder...</button>
    </div>
    <div class="recent-chips" id="recent-output-dirs"></div>
    <label class="check-row" style="margin-top:8px;cursor:pointer;user-select:none;font-size:13px;display:flex;align-items:center;gap:4px"
      title="When re-running against the same output folder, files already optimized there are reused instead of being recompressed. Only applies when an output folder is set.">
      <input type="checkbox" id="skip-existing" /> Skip files already in the output folder
    </label>
    <label class="check-row" style="margin-top:8px;cursor:pointer;user-select:none;font-size:13px;display:flex;align-items:center;gap:4px"
      title="Keep a curated subset of EXIF metadata (camera make/model, date, exposure) in the output. GPS coordinates, Orientation (already baked into the pixels), and bulky MakerNote are dropped. Off by default — turn on only if you need the metadata preserved.">
      <input type="checkbox" id="keep-exif" /> Keep EXIF metadata (camera info, date; GPS stripped)
    </label>
  </div>

  <!-- Config + Action -->
  <div class="card" id="config-section">
    <div class="card-title">Settings</div>
    <div class="config-grid" style="margin-bottom:16px">
      <div class="config-group">
        <label title="Controls how much color detail Standard mode is allowed to sacrifice for size. For UI screenshots with text, High usually costs little extra size since screenshots rarely use many colors to begin with.">Quality</label>
        <div class="radio-group" id="quality-group">
          <input type="radio" name="quality" id="q-high" value="high"
            title="Controls how much color detail Standard mode is allowed to sacrifice for size. For UI screenshots with text, High usually costs little extra size since screenshots rarely use many colors to begin with.">
          <label for="q-high"
            title="Controls how much color detail Standard mode is allowed to sacrifice for size. For UI screenshots with text, High usually costs little extra size since screenshots rarely use many colors to begin with.">High</label>
          <input type="radio" name="quality" id="q-med" value="medium" checked><label for="q-med">Medium</label>
          <input type="radio" name="quality" id="q-low" value="low"><label for="q-low">Low</label>
        </div>
      </div>
      <div class="config-group">
        <label title="Shrinking dimensions is the one setting that can genuinely blur small text — screenshots with UI text often look best left at 'No resize' or scaled down only slightly.">Max Width</label>
        <select id="max-width"
          title="Shrinking dimensions is the one setting that can genuinely blur small text — screenshots with UI text often look best left at 'No resize' or scaled down only slightly.">
          <option value="0">No resize</option>
          <option value="1920">1920px</option>
          <option value="1500">1500px</option>
          <option value="1200">1200px</option>
        </select>
      </div>
      <div class="config-group">
        <label>Output Format</label>
        <div class="radio-group" id="format-group">
          <input type="radio" name="format" id="fmt-png" value="png" checked><label for="fmt-png">PNG</label>
          <input type="radio" name="format" id="fmt-webp" value="webp"
            title="WebP typically produces smaller files than PNG at similar visual quality. Uses its own encoder (not pngquant/oxipng) — Quality/Protect Colors/Dithering don't apply, only Compression Mode's lossy-vs-lossless choice does.">
          <label for="fmt-webp"
            title="WebP typically produces smaller files than PNG at similar visual quality. Uses its own encoder (not pngquant/oxipng) — Quality/Protect Colors/Dithering don't apply, only Compression Mode's lossy-vs-lossless choice does.">WebP</label>
        </div>
      </div>
      <div class="config-group">
        <label title="Choose how compression is achieved.">Compression Mode</label>
        <div class="radio-group" id="mode-group">
          <input type="radio" name="mode" id="mode-standard" value="standard" checked
            title="Best compression. Reduces the image to a smaller color palette before compressing — may cause slight color shifts on small or unique-colored details.">
          <label for="mode-standard"
            title="Best compression. Reduces the image to a smaller color palette before compressing — may cause slight color shifts on small or unique-colored details.">Standard</label>
          <input type="radio" name="mode" id="mode-lossless" value="lossless"
            title="No color changes at all. Compresses without touching pixel values — larger files than Standard, but pixel-perfect.">
          <label for="mode-lossless"
            title="No color changes at all. Compresses without touching pixel values — larger files than Standard, but pixel-perfect.">Lossless</label>
          <input type="radio" name="mode" id="mode-resize" value="resize_only"
            title="Shrinks image dimensions (requires Max Width to be set) and compresses losslessly — keeps full original color accuracy at the smaller size.">
          <label for="mode-resize"
            title="Shrinks image dimensions (requires Max Width to be set) and compresses losslessly — keeps full original color accuracy at the smaller size.">Resize Only</label>
        </div>
      </div>
      <div class="config-group" id="protect-colors-group">
        <label title="Colors listed here are prioritized when building the compressed palette, reducing the chance they get replaced by a similar color. Not a 100% guarantee. Only applies in Standard mode.">Protect Colors</label>
        <input type="text" id="protect-colors" placeholder="#2ecc71, #ff0000"
          title="Colors listed here (hex codes, comma-separated) are prioritized when building the compressed palette, reducing the chance they get replaced by a similar color. Not a 100% guarantee — pngquant may still adjust the rest of the palette. Only applies in Standard mode.">
      </div>
      <div class="config-group" id="dithering-group">
        <label title="Smooths color transitions by mixing nearby palette colors in a fine pattern. For screenshots with UI text, turning this off usually keeps text edges cleaner. Only applies in Standard mode.">Dithering</label>
        <label class="check-row"
          title="Smooths color transitions by mixing nearby palette colors in a fine pattern. Usually helps gradients and photos, but can make flat-color graphics and text edges (icons, UI screenshots) look slightly grainy. Turn off for cleaner text and flat colors. Only applies in Standard mode.">
          <input type="checkbox" id="dithering" checked /> Enabled
        </label>
      </div>
    </div>
    <div id="mode-hint" style="display:none;font-size:12px;color:var(--red);margin:-8px 0 16px"></div>
    <div class="action-bar">
      <div class="spacer"></div>
      <span style="font-size:13px;color:var(--text2)" id="file-count-info"></span>
      <button class="btn btn-primary" id="start-btn" disabled>Start</button>
    </div>
  </div>

  </div>

  <div class="app-main">

  <!-- File List -->
  <div class="card" id="files-section">
    <div class="card-title">Files</div>
    <div class="file-stats">

  <div class="card" id="progress-section">

        <button class="btn btn-primary btn-sm" id="resume-btn" style="display:none;padding:4px 12px;font-size:12px">Resume</button>
        <button class="btn btn-danger btn-sm" id="cancel-btn" style="display:none;padding:4px 12px;font-size:12px">Cancel</button>

  <!-- Results -->

    <div class="result-summary" id="result-summary"></div>
    <div class="action-bar" style="margin-bottom:12px">
      <span id="output-path-info" style="font-size:12px;color:var(--text2)"></span>
      <div class="spacer"></div>
      <button class="btn btn-secondary" id="retry-btn" style="display:none">Retry Failed</button>
      <button class="btn btn-primary" id="download-btn" style="display:none">Download All (ZIP)</button>
      <button class="btn btn-secondary" id="reset-btn">Reset</button>

        <option value="savings_desc">Compression % (high to low)</option>
        <option value="savings_asc">Compression % (low to high)</option>
        <option value="size_desc">Compressed size (large to small)</option>
        <option value="saved_desc">Bytes saved (most first)</option>

</div>

<script>
const STATE = {
  files: [],
  results: [],
  wsName: '',
  isRunning: false,
  isPaused: false,      // authoritative pause flag; SSE's result/log events don't carry it
                         // (only 'status' and 'done' do), so result/log handlers read this
                         // instead of assuming "not paused" — see startSSE().
  pollTimer: null,
  runStartTime: 0,      // ms timestamp when the current run began (for ETA)
  resultSort: 'default',
  resultFilter: 'all',
  resultCursor: 0,      // # of results already pulled (incremental /api/progress)
  logCursor: 0,         // # of log lines already pulled
  logLines: [],         // accumulated log lines (capped for display)
  fileOverrides: {},    // {file_id: {field: value}} — per-file settings that override the globals; only files the user expanded get an entry
};

// DOM refs
const $ = id => document.getElementById(id);

// Wraps fetch() to attach the per-session app token (see APP_TOKEN in the
// page <head>) as a custom header. Only needed for state-changing/sensitive
// endpoints — image-serving endpoints (thumb/result/source-file/download)
// are loaded via plain <img src>/<a href> and can't carry custom headers
// anyway, and don't need this protection (see the backend comment on
// require_token for why the header itself is the actual defense).
function apiFetch(url, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'X-App-Token': window.APP_TOKEN || '' });
  return fetch(url, options);
}


// Lightweight toast notification. type: 'err' | 'ok' | 'info'.
// (This was called in 8 places without ever being defined — every error
// path in the app was throwing an uncaught ReferenceError instead of
// telling the user anything went wrong.)
const noticeContainer = $('notice-container');
let persistentNoticeEl = null;

function showNotice(message, type) {
  type = type || 'info';
  const el = document.createElement('div');
  el.className = `notice ${type}`;
  el.innerHTML = `<span class="notice-msg"></span><button class="notice-close" aria-label="Dismiss">&times;</button>`;
  el.querySelector('.notice-msg').textContent = message;
  const remove = () => el.remove();
  el.querySelector('.notice-close').addEventListener('click', remove);
  noticeContainer.appendChild(el);
  setTimeout(remove, 5000);
}

function showPersistentNotice(message, type) {
  dismissPersistentNotice();
  const el = document.createElement('div');
  el.className = `notice ${type || 'info'}`;
  el.innerHTML = `<span class="notice-msg"></span><button class="notice-close" aria-label="Dismiss">&times;</button>`;
  el.querySelector('.notice-msg').textContent = message;
  el.querySelector('.notice-close').addEventListener('click', () => dismissPersistentNotice());
  noticeContainer.appendChild(el);
  persistentNoticeEl = el;
}

function dismissPersistentNotice() {
  if (persistentNoticeEl) {
    persistentNoticeEl.remove();
    persistentNoticeEl = null;
  }
}

const dirPath = $('dir-path'),
      scanBtn = $('scan-btn'),
      fileInput = $('file-input'),
      outputDir = $('output-dir'),
      outputBrowseBtn = $('output-browse-btn'),
      fileGrid = $('file-grid'),
      fileStatsText = $('file-stats-text'),
      selectAll = $('select-all'),
      fileCountInfo = $('file-count-info'),
      startBtn = $('start-btn'),
      progressSection = $('progress-section'),
      progressFill = $('progress-fill'),
      progressText = $('progress-text'),
      cancelBtn = $('cancel-btn'),
      pauseBtn = $('pause-btn'),
      resumeBtn = $('resume-btn'),
      escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),
      logBox = $('log-box'),
      resultsSection = $('results-section'),
      resultsEmpty = $('results-empty'),
      filesEmpty = $('files-empty'),
      resultSummary = $('result-summary'),
      resultGrid = $('result-grid'),
      downloadBtn = $('download-btn'),
      resetBtn = $('reset-btn'),
      healthStatus = $('health-status'),
      configSection = $('config-section'),
      filesSection = $('files-section'),
      protectColorsInput = $('protect-colors'),
      protectColorsGroup = $('protect-colors-group'),
      ditheringInput = $('dithering'),
      ditheringGroup = $('dithering-group'),
      modeHint = $('mode-hint'),
      retryBtn = $('retry-btn'),
      resultToolbar = $('result-toolbar'),
      resultSortSel = $('result-sort'),
      resultFilterSel = $('result-filter'),
      resultCountEl = $('result-count'),
      themeToggle = $('theme-toggle');

// Utility
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

// Format a duration in seconds as "mm:ss" (or "h:mm:ss" past an hour).
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// Theme: 'light' | 'dark' persisted in localStorage. When nothing is stored
// we leave the data-theme attribute off entirely so the prefers-color-scheme
// media query decides (follow the OS). The toggle always writes an explicit
// choice, which from then on overrides the OS setting.
function currentTheme() {
  const stored = localStorage.getItem('imgopt.theme');
  if (stored === 'light' || stored === 'dark') return stored;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyStoredTheme() {
  const stored = localStorage.getItem('imgopt.theme');
  if (stored === 'light' || stored === 'dark') {
    document.documentElement.setAttribute('data-theme', stored);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  themeToggle.textContent = currentTheme() === 'dark' ? '\u2600' : '\u263e'; // sun when dark (click->light), moon when light
}
themeToggle.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('imgopt.theme', next);
  applyStoredTheme();
});

// Config memory: persist the last-used settings so a page refresh doesn't
// reset Quality/Format/Mode/etc. back to the HTML defaults. Stored under one
// key as a plain object; missing/corrupt storage falls back to the HTML
// defaults (the hardcoded `checked` attributes) untouched.
function saveConfig() {
  try {
    const cfg = {
      quality: (document.querySelector('input[name="quality"]:checked') || {}).value,
      maxWidth: $('max-width').value,
      format: (document.querySelector('input[name="format"]:checked') || {}).value,
      mode: (document.querySelector('input[name="mode"]:checked') || {}).value,
      dithering: ditheringInput.checked,
      protectColors: protectColorsInput.value,
      recursive: $('recursive-scan').checked,
      skipExisting: $('skip-existing').checked,
      keepExif: $('keep-exif').checked,
    };
    localStorage.setItem('imgopt.config', JSON.stringify(cfg));
  } catch (e) { /* storage unavailable/full — non-critical */ }
}
function loadConfig() {
  let cfg;
  try { cfg = JSON.parse(localStorage.getItem('imgopt.config') || 'null'); }
  catch (e) { cfg = null; }
  if (!cfg) return;
  const setRadio = (name, val) => {
    if (val == null) return;
    const el = document.querySelector(`input[name="${name}"][value="${val}"]`);
    if (el) el.checked = true;
  };
  setRadio('quality', cfg.quality);
  setRadio('format', cfg.format);
  setRadio('mode', cfg.mode);
  if (cfg.maxWidth != null && $('max-width').querySelector(`option[value="${cfg.maxWidth}"]`)) {
    $('max-width').value = cfg.maxWidth;
  }
  if (typeof cfg.dithering === 'boolean') ditheringInput.checked = cfg.dithering;
  if (typeof cfg.protectColors === 'string') protectColorsInput.value = cfg.protectColors;
  if (typeof cfg.recursive === 'boolean') $('recursive-scan').checked = cfg.recursive;
  if (typeof cfg.skipExisting === 'boolean') $('skip-existing').checked = cfg.skipExisting;
  if (typeof cfg.keepExif === 'boolean') $('keep-exif').checked = cfg.keepExif;
}
// Save on any config change. updateModeDependentControls (bound separately
// for format/mode) also recomputes disabled states; saveConfig is additive.
['quality', 'format', 'mode'].forEach(name =>
  document.querySelectorAll(`input[name="${name}"]`).forEach(r => r.addEventListener('change', saveConfig)));
$('max-width').addEventListener('change', saveConfig);
ditheringInput.addEventListener('change', saveConfig);
protectColorsInput.addEventListener('input', saveConfig);
$('recursive-scan').addEventListener('change', saveConfig);
$('skip-existing').addEventListener('change', saveConfig);
$('keep-exif').addEventListener('change', saveConfig);

// Health check
async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    const tools = [];
    if (d.pngquant) tools.push('pngquant ✓');
    else tools.push('pngquant ✗');
    if (d.oxipng) tools.push('oxipng ✓');
    else tools.push('oxipng ✗');
    const allOk = d.pngquant && d.oxipng;
    healthStatus.innerHTML =
      `<span class="status-dot ${allOk ? 'ok' : 'warn'}"></span>${tools.join(' ')}`;
    // NOTE: deliberately no startBtn touching here — missing binaries only
    // degrade compression (see available_modes server-side), they don't
    // make Start invalid. updateStartButtonState() owns that button.
    return allOk;
  } catch(e) {
    healthStatus.innerHTML = '<span class="status-dot err"></span>Connection failed';
    return false;
  }
}

// Scan directory
const scanProgressWrap = $('scan-progress-wrap'),
      scanProgressFill = $('scan-progress-fill'),
      scanProgressText = $('scan-progress-text');
let scanPollTimer = null;

async function scanPath(path) {
  dismissPersistentNotice();
  const recursive = $('recursive-scan').checked;
  scanBtn.disabled = true;
  scanBtn.textContent = 'Scanning...';
  scanProgressWrap.style.display = 'block';
  scanProgressFill.style.width = '0%';
  scanProgressText.textContent = 'Finding images...';
  try {
    const r = await apiFetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ directory: path, recursive }),
    });
    const d = await r.json();
    if (d.error) { showNotice(d.error, 'err'); resetScanUI(); return; }
    scanPollTimer = setInterval(pollScanProgress, 250);
  } catch(e) {
    showNotice('Scan failed: ' + e.message, 'err');
    resetScanUI();
  }
}

function resetScanUI() {
  scanBtn.disabled = false;
  scanBtn.textContent = 'Scan Folder';
  scanProgressWrap.style.display = 'none';
  if (scanPollTimer) { clearInterval(scanPollTimer); scanPollTimer = null; }
}

async function pollScanProgress() {
  try {
    const r = await apiFetch('/api/scan-progress');
    const d = await r.json();
    if (d.total > 0) {
      const pct = Math.round((d.current / d.total) * 100);
      scanProgressFill.style.width = pct + '%';
      scanProgressText.textContent = `Scanning ${d.current} / ${d.total} images...`;
    } else {
      scanProgressText.textContent = 'Finding images...';
    }
    if (!d.running) {
      resetScanUI();
      if (d.error) { showNotice('Scan failed: ' + d.error, 'err'); return; }
      STATE.files = d.files;
      STATE.wsName = d.files[0]?.thumbnail?.split('/')[3] || '';
      renderFiles();
      showConfigSection();
      loadRecentPaths();
    }
  } catch(e) {
    resetScanUI();
    showNotice('Lost connection while scanning: ' + e.message, 'err');
  }
}

// Recently used folders (like FocusOCR) — click a chip to reuse it instead
// of browsing again. Persisted server-side so it survives restarts.
const recentScanEl = $('recent-scan-dirs'), recentOutputEl = $('recent-output-dirs');
function renderRecentChips(container, paths, onPick, onRemove, onClearAll) {
  container.innerHTML = '';
  for (const p of paths) {
    const chip = document.createElement('span');
    chip.className = 'recent-chip';
    chip.title = p;
    const text = document.createElement('span');
    text.textContent = p;
    text.style.cursor = 'pointer';
    text.addEventListener('click', () => onPick(p));
    chip.appendChild(text);
    const del = document.createElement('span');
    del.textContent = '×';
    del.style.cssText = 'margin-left:4px;cursor:pointer;font-size:14px;line-height:1;color:var(--text2);opacity:.5';
    del.addEventListener('click', (e) => { e.stopPropagation(); onRemove(p); });
    chip.appendChild(del);
    container.appendChild(chip);
  }
  if (paths.length > 1) {
    const clearAll = document.createElement('span');
    clearAll.className = 'recent-chip';
    clearAll.textContent = 'Clear all';
    clearAll.style.cssText = 'font-size:12px;color:var(--text2);cursor:pointer';
    clearAll.addEventListener('click', onClearAll);
    container.appendChild(clearAll);
  }
}
async function loadRecentPaths() {
  try {
    const r = await apiFetch('/api/recent');
    const d = await r.json();
    renderRecentChips(recentScanEl, d.scan_dirs || [],
      (p) => { dirPath.value = p; scanPath(p); },
      async (p) => { await apiFetch('/api/recent/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'scan_dirs', value: p }) }); loadRecentPaths(); },
      async () => { await apiFetch('/api/recent/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'scan_dirs' }) }); loadRecentPaths(); },
    );
    renderRecentChips(recentOutputEl, d.output_dirs || [],
      (p) => { outputDir.value = p; },
      async (p) => { await apiFetch('/api/recent/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'output_dirs', value: p }) }); loadRecentPaths(); },
      async () => { await apiFetch('/api/recent/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'output_dirs' }) }); loadRecentPaths(); },
    );
  } catch(e) {
    // Non-critical — just skip showing the recent-folder chips.
  }
}

scanBtn.addEventListener('click', () => {
  const path = dirPath.value.trim();
  if (!path) { showNotice('Please enter a folder path', 'err'); return; }
  scanPath(path);
});

// Opens the OS native folder picker via the server (tkinter on Windows).
// The browser doesn't expose real filesystem paths for security, so we
// can't use webkitdirectory for output path — the server-side dialog is
// the only reliable way to get a real writable path. The dialog shows
// Python's icon (not Chrome's) because it's a server-side window, not
// something the browser is opening.
async function pickFolder() {
  try {
    const r = await apiFetch('/api/browse-folder');
    const d = await r.json();
    if (d.error) {
      showNotice(`Folder picker unavailable: ${d.error}. Type the path manually instead.`, 'err');
      return '';
    }
    return d.path || ''; // '' also covers the user simply cancelling the dialog
  } catch(e) {
    showNotice('Folder picker failed: ' + e.message, 'err');
    return '';
  }
}

// Output path: text field is the source of truth; the server-side picker
// fills it in. No webkitdirectory here — the browser can't give us the
// real path we need to write files to.
outputBrowseBtn.addEventListener('click', async () => {
  outputBrowseBtn.disabled = true;
  outputBrowseBtn.textContent = 'Selecting...';
  try {
    const path = await pickFolder();
    if (path) outputDir.value = path;
    // No path = user cancelled; do nothing.
  } catch(e) {
    // ignore — user can still type a path manually
  } finally {
    outputBrowseBtn.disabled = false;
    outputBrowseBtn.textContent = 'Browse Folder...';
  }
});

// Browse Folder (Select Images): pick a folder path → auto-scan it.
// This is a local tool — no uploading, just reads files by path.
const browseFolderBtn = $('browse-folder-btn');
browseFolderBtn.addEventListener('click', async () => {
  browseFolderBtn.disabled = true;
  browseFolderBtn.textContent = 'Selecting...';
  try {
    const path = await pickFolder();
    if (path) {
      dirPath.value = path;
      await scanPath(path);
    }
  } catch(e) {
    showNotice('Folder picker failed: ' + e.message, 'err');
  } finally {
    browseFolderBtn.disabled = false;
    browseFolderBtn.textContent = 'Browse Folder...';
  }
});

$('browse-files-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files.length) return;
  await uploadFiles(files);
});

async function uploadFiles(files) {
  dismissPersistentNotice();
  const formData = new FormData();
  for (const f of files) formData.append('files', f);

  try {
    const r = await apiFetch('/api/upload', { method: 'POST', body: formData });
    const d = await r.json();
    if (d.error) { showNotice(d.error, 'err'); return; }
    STATE.files = d.files;
    STATE.wsName = d.files[0]?.thumbnail?.split('/')[3] || '';
    renderFiles();
    showConfigSection();
  } catch(e) {
    showNotice('Upload failed: ' + e.message, 'err');
  }
}

// Render file grid
function renderFiles() {
  const files = STATE.files;
  // Drop override entries for ids no longer present (e.g. after a re-scan
  // of a different folder). Keeps STATE.fileOverrides in sync with the
  // current file set without wiping the user's per-file edits on a mere
  // re-render (same ids are preserved).
  const ids = new Set(files.map(f => f.id));
  for (const k of Object.keys(STATE.fileOverrides)) {
    if (!ids.has(k)) delete STATE.fileOverrides[k];
  }
  if (!files.length) {
    fileGrid.innerHTML = '';
    filesEmpty.textContent = 'No images found';
    filesEmpty.style.display = '';
    fileStatsText.textContent = '';
    selectAll.checked = true;
    return;
  }
  filesEmpty.style.display = 'none';
  let html = '';
  for (const f of files) {
    html += `
      <div class="file-card selected" data-id="${f.id}" onclick="toggleFile('${f.id}')">
        <div class="fc-main">
          <img class="thumb" src="${f.thumbnail}" alt="${escHtml(f.name)}" loading="lazy" />
          <div class="fname" title="${escHtml(f.name)}">${escHtml(f.name)}</div>
          <div class="fsize">${fmtSize(f.size)}</div>
          <div class="check">✓</div>
          <button class="card-gear" type="button" title="Per-file settings (override the global quality/mode for just this file)"
            onclick="event.stopPropagation(); toggleFileOverride('${f.id}', this)">⚙</button>
          <button class="preview-btn" type="button"
            title="Run a single-file dry run with the current settings to project the compressed size. Does not affect results or the download ZIP."
            onclick="event.stopPropagation(); previewFile('${f.id}', this)">Preview</button>
        </div>
        <div class="file-override" data-id="${f.id}" hidden onclick="event.stopPropagation()">
          <div class="fo-row">
            <span class="fo-label">Quality</span>
            <select data-field="quality" onchange="setFileOverride('${f.id}')">
              <option value="">inherit</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option>
            </select>
          </div>
          <div class="fo-row">
            <span class="fo-label">Mode</span>
            <select data-field="compression_mode" onchange="setFileOverride('${f.id}')">
              <option value="">inherit</option><option value="standard">standard</option><option value="lossless">lossless</option><option value="resize_only">resize only</option>
            </select>
          </div>
          <div class="fo-row">
            <span class="fo-label">Width</span>
            <input type="number" min="0" data-field="max_width" placeholder="inherit" oninput="setFileOverride('${f.id}')">
          </div>
        </div>
      </div>
    `;
  }
  fileGrid.innerHTML = html;
  const total = files.reduce((s, f) => s + f.size, 0);
  fileStatsText.textContent = `${files.length} file(s), ${fmtSize(total)} total`;
  selectAll.checked = true;
}

function toggleFile(id) {
  const el = fileGrid.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  el.classList.toggle('selected');
  const all = fileGrid.querySelectorAll('.file-card');
  const sel = fileGrid.querySelectorAll('.file-card.selected');
  selectAll.checked = all.length === sel.length;
}

// Single-file dry run: projects the compressed size of one file under the
// current settings WITHOUT touching the results list or the download ZIP
// (server-side it writes to ws/preview, not ws/output, then deletes it).
// Reads the same controls runOptimize uses so the projection matches what
// a real run would produce for this file.
async function previewFile(id, btn) {
  if (STATE.isRunning) { showNotice('Wait for the current run to finish before previewing.', 'err'); return; }
  const quality = document.querySelector('input[name="quality"]:checked').value;
  const maxWidth = parseInt($('max-width').value);
  const format = document.querySelector('input[name="format"]:checked').value;
  const compressionMode = document.querySelector('input[name="mode"]:checked').value;
  const protectedColors = protectColorsInput.value.split(',').map(s => s.trim()).filter(Boolean);
  const dithering = ditheringInput.checked;
  const keepExif = $('keep-exif').checked;
  const prevText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const r = await apiFetch('/api/preview-optimize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file_id: id, quality, max_width: maxWidth, output_format: format,
        compression_mode: compressionMode, protected_colors: protectedColors,
        dithering, keep_exif: keepExif,
      }),
    });
    const d = await r.json();
    if (!r.ok || d.error) {
      btn.textContent = 'failed';
      showNotice(d.error || 'Preview failed', 'err');
    } else {
      // Show projected size + savings; reverts after a few seconds.
      btn.textContent = `${fmtSize(d.compressed_size)} (-${d.savings_percent}%)`;
    }
  } catch (e) {
    btn.textContent = 'failed';
  } finally {
    btn.disabled = false;
    setTimeout(() => { if (btn.textContent !== 'Preview') btn.textContent = 'Preview'; }, 4000);
  }
}

// Per-file override UI: clicking the gear toggles a small panel where the
// user sets quality/mode/width for just this file. Empty/"inherit" values
// are dropped, so STATE.fileOverrides only holds files with at least one
// non-default field — exactly the "only override files the user manually
// expanded" rule from the review. The whole map is sent on Start; the
// server ignores entries for unselected ids.
function toggleFileOverride(id, gearBtn) {
  const card = fileGrid.querySelector(`.file-card[data-id="${id}"]`);
  if (!card) return;
  const panel = card.querySelector('.file-override');
  const willShow = panel.hasAttribute('hidden');
  if (willShow) panel.removeAttribute('hidden'); else panel.setAttribute('hidden', '');
  // Pre-fill the panel from any existing override for this file.
  const ov = STATE.fileOverrides[id] || {};
  card.querySelectorAll('.file-override [data-field]').forEach(el => {
    el.value = ov[el.dataset.field] != null ? ov[el.dataset.field] : '';
  });
}
function setFileOverride(id) {
  const card = fileGrid.querySelector(`.file-card[data-id="${id}"]`);
  if (!card) return;
  const ov = {};
  card.querySelectorAll('.file-override [data-field]').forEach(el => {
    const v = el.value.trim();
    if (v !== '') ov[el.dataset.field] = el.dataset.field === 'max_width' ? parseInt(v) : v;
  });
  if (Object.keys(ov).length) {
    STATE.fileOverrides[id] = ov;
    card.classList.add('has-override');
  } else {
    delete STATE.fileOverrides[id];
    card.classList.remove('has-override');
  }
}

selectAll.addEventListener('change', () => {
  const checked = selectAll.checked;
  fileGrid.querySelectorAll('.file-card').forEach(el => el.classList.toggle('selected', checked));
});

// Show config and files sections
function showConfigSection() {
  configSection.classList.add('active');
  filesSection.classList.add('active');
  const files = STATE.files;
  fileCountInfo.textContent = files.length ? `${files.length} files ready` : 'No files found';
  updateStartButtonState();
}

// Compression Mode: controls which settings are relevant.
function updateModeDependentControls() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const format = document.querySelector('input[name="format"]:checked').value;
  const isStandard = mode === 'standard';
  const isPng = format === 'png';

  // Protect Colors / Dithering: pngquant-specific — only apply in Standard
  // mode AND when the output format is PNG (WebP uses its own encoder and
  // never touches pngquant, regardless of compression mode).
  const pngquantApplies = isStandard && isPng;
  protectColorsInput.disabled = !pngquantApplies;
  ditheringInput.disabled = !pngquantApplies;
  protectColorsGroup.classList.toggle('disabled-group', !pngquantApplies);
  ditheringGroup.classList.toggle('disabled-group', !pngquantApplies);

  // Quality: relevant for Standard-mode PNG (pngquant target) and for
  // Standard-mode WebP (Pillow's own quality parameter) — only meaningless
  // when compression mode isn't Standard (Lossless/Resize Only skip
  // quality entirely for both formats).
  document.querySelectorAll('input[name="quality"]').forEach(r => r.disabled = !isStandard);
  document.getElementById('quality-group').classList.toggle('disabled-group', !isStandard);

  // Max Width is intentionally NOT tied to compression mode or format —
  // resizing is orthogonal to how colors/encoding are handled. You can
  // shrink dimensions in Standard mode just as validly as in Lossless/
  // Resize Only (in fact combining resize with quantization is one of the
  // strongest ways to cut file size), so it stays enabled in all cases.

  updateStartButtonState();
}
document.querySelectorAll('input[name="format"]').forEach(r => r.addEventListener('change', updateModeDependentControls));
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', updateModeDependentControls));
$('max-width').addEventListener('change', updateStartButtonState);

// Central place that decides whether Start can be clicked: needs at least
// one file, and Resize Only mode specifically needs a Max Width > 0 (it has
// nothing else to do otherwise).
function updateStartButtonState() {
  const hasFiles = STATE.files.length > 0;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const maxWidth = parseInt($('max-width').value);
  const resizeOnlyNeedsWidth = mode === 'resize_only' && maxWidth <= 0;
  if (resizeOnlyNeedsWidth) {
    modeHint.textContent = 'Resize Only mode needs a Max Width other than "No resize".';
    modeHint.style.display = 'block';
  } else {
    modeHint.style.display = 'none';
  }
  startBtn.disabled = STATE.isRunning || !hasFiles || resizeOnlyNeedsWidth;
}

// Start optimization. Shared by the Start button (full/selected run) and the
// Retry Failed button (retry=true re-runs only the given ids server-side
// without wiping earlier successful outputs).
async function runOptimize(ids, opts) {
  opts = opts || {};
  const retry = !!opts.retry;

  const quality = document.querySelector('input[name="quality"]:checked').value;
  const maxWidth = parseInt($('max-width').value);
  const format = document.querySelector('input[name="format"]:checked').value;
  const outputDir = $('output-dir').value.trim();
  const compressionMode = document.querySelector('input[name="mode"]:checked').value;
  const protectedColors = protectColorsInput.value.split(',').map(s => s.trim()).filter(Boolean);
  const dithering = ditheringInput.checked;

  STATE.isRunning = true;
  STATE.runStartTime = Date.now();
  STATE.total = ids.length;
  if (!retry) STATE.results = [];
  // Incremental-poll cursors always restart at 0 for a new run: the server's
  // state.results is the source of truth (on retry it already holds the
  // preserved successes), so a from-zero first poll re-syncs the full set,
  // then subsequent polls only carry the tail.
  STATE.resultCursor = 0;
  STATE.logCursor = 0;
  STATE.logLines = [];
  STATE.isPaused = false;
  // Clean up any transport left over from a previous run before starting fresh.
  if (STATE.pollTimer) { clearInterval(STATE.pollTimer); STATE.pollTimer = null; }
  stopSSE();

  dismissPersistentNotice();

  // Show progress section
  progressSection.classList.add('active');
  resultsSection.classList.remove('active');
  cancelBtn.style.display = '';
  pauseBtn.style.display = '';
  resumeBtn.style.display = 'none';
  logBox.innerHTML = '';
  progressFill.style.width = '0%';
  progressText.textContent = retry ? 'Retrying...' : 'Starting...';
  startBtn.disabled = true;
  retryBtn.disabled = true;

  try {
    const r = await apiFetch('/api/optimize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file_ids: ids, quality, max_width: maxWidth, output_format: format, output_dir: outputDir,
        compression_mode: compressionMode, protected_colors: protectedColors, dithering, retry,
        skip_existing: $('skip-existing').checked,
        keep_exif: $('keep-exif').checked,
        overrides: STATE.fileOverrides,
      }),
    });
    const d = await r.json();
    if (d.error) {
      showNotice(d.error, 'err');
      STATE.isRunning = false;
      cancelBtn.style.display = 'none';
      pauseBtn.style.display = 'none';
      resumeBtn.style.display = 'none';
      retryBtn.disabled = false;
      updateStartButtonState();
      return;
    }
    if (d.warning) showNotice(d.warning, 'info');

    // Stream progress over SSE (primary); falls back to polling
    // automatically on connect failure or sustained silence.
    startSSE();
    loadRecentPaths();
  } catch(e) {
    showNotice((retry ? 'Retry failed: ' : 'Start failed: ') + e.message, 'err');
    STATE.isRunning = false;
    cancelBtn.style.display = 'none';
    pauseBtn.style.display = 'none';
    resumeBtn.style.display = 'none';
    retryBtn.disabled = false;
    updateStartButtonState();
  }
}

startBtn.addEventListener('click', () => {
  const selected = fileGrid.querySelectorAll('.file-card.selected');
  const ids = Array.from(selected).map(el => el.dataset.id);
  runOptimize(ids, { retry: false });
});

retryBtn.addEventListener('click', () => {
  const failedIds = STATE.results.filter(r => !r.success).map(r => r.id).filter(id => id != null);
  if (!failedIds.length) { showNotice('No failed files to retry', 'info'); return; }
  runOptimize(failedIds, { retry: true });
});

async function pollProgress() {
  try {
    const r = await fetch(`/api/progress?since_result=${STATE.resultCursor}&since_log=${STATE.logCursor}`);
    const d = await r.json();

    STATE.isRunning = d.running;
    STATE.isPaused = !!d.paused;
    setRunButtons(d.running, d.paused);

    // Accumulate the incremental results tail. When the cursor is 0 (first
    // poll of a run, or a reattach) we replace; afterwards we append only the
    // new entries the server sent. STATE.results stays the full set either way.
    if (d.results && d.results.length) {
      if (STATE.resultCursor === 0) STATE.results = d.results.slice();
      else for (const item of d.results) STATE.results.push(item);
    }
    if (typeof d.result_total === 'number') STATE.resultCursor = d.result_total;

    renderProgressBar(d.running, d.paused, d.current, d.total);
    if (d.logs && d.logs.length) {
      for (const l of d.logs) STATE.logLines.push(l);
      renderLogs();
    }
    if (typeof d.log_total === 'number') STATE.logCursor = d.log_total;

    if (!d.running) {
      finalizeRun();
    }
  } catch(e) {
    // ignore poll errors
  }
}

// --- SSE transport (primary) with polling fallback ---
// EventSource streams result/log/done events; if it errors or goes silent
// for several seconds (proxy buffering, paused run), we drop to the polling
// path above automatically. Both read the same server state, so the user
// sees consistent progress either way. See OPTIMIZATION_PLAN.md §5.
let sseSource = null, sseWatchdog = null, sseLastMsg = 0, usingSSE = false;
const SSE_SILENCE_MS = 8000;

function startSSE() {
  usingSSE = true;
  sseLastMsg = Date.now();
  try {
    sseSource = new EventSource('/api/events');
  } catch (e) {
    fallbackToPolling();
    return;
  }
  sseSource.addEventListener('status', e => {
    sseLastMsg = Date.now();
    let d = {};
    try { d = JSON.parse(e.data); } catch (_) {}
    STATE.isPaused = !!d.paused;
    setRunButtons(true, STATE.isPaused);
    renderProgressBar(true, STATE.isPaused, d.current != null ? d.current : STATE.results.length, d.total != null ? d.total : STATE.total);
  });
  sseSource.addEventListener('result', e => {
    sseLastMsg = Date.now();
    try { STATE.results.push(JSON.parse(e.data)); } catch (_) {}
    // A result can arrive just after Pause was clicked — it's a file that
    // was already mid-compression when the run paused, finishing up on its
    // own (see /api/pause docstring). Keep reflecting the real paused state
    // here rather than assuming "a result came in, so we must be running
    // normally" — that assumption is what made Pause look broken.
    setRunButtons(true, STATE.isPaused);
    renderProgressBar(true, STATE.isPaused, STATE.results.length, STATE.total);
  });
  sseSource.addEventListener('log', e => {
    sseLastMsg = Date.now();
    try { STATE.logLines.push(JSON.parse(e.data).line); } catch (_) {}
    renderLogs();
  });
  sseSource.addEventListener('done', e => {
    sseLastMsg = Date.now();
    let d = {};
    try { d = JSON.parse(e.data); } catch (_) {}
    STATE.isRunning = false;
    stopSSE();
    renderProgressBar(false, false, d.current != null ? d.current : STATE.results.length, d.total != null ? d.total : STATE.total);
    finalizeRun();
  });
  sseSource.onerror = () => { fallbackToPolling(); };
  // Watchdog: silent too long → a proxy may be buffering the stream, or the
  // run is paused (SSE sends only heartbeats then). Polling reports the full
  // state (including paused) so fall back rather than look frozen.
  sseWatchdog = setInterval(() => {
    if (usingSSE && Date.now() - sseLastMsg > SSE_SILENCE_MS) fallbackToPolling();
  }, 2000);
}

function stopSSE() {
  usingSSE = false;
  if (sseSource) { sseSource.close(); sseSource = null; }
  if (sseWatchdog) { clearInterval(sseWatchdog); sseWatchdog = null; }
}

function fallbackToPolling() {
  stopSSE();
  if (!STATE.pollTimer && STATE.isRunning) {
    STATE.pollTimer = setInterval(pollProgress, 400);
  }
}

// Shared render helpers used by both the SSE path and the polling fallback.
function setRunButtons(running, paused) {
  if (running) {
    cancelBtn.style.display = '';
    pauseBtn.style.display = paused ? 'none' : '';
    resumeBtn.style.display = paused ? '' : 'none';
  } else {
    cancelBtn.style.display = 'none';
    pauseBtn.style.display = 'none';
    resumeBtn.style.display = 'none';
  }
}

function renderProgressBar(running, paused, current, total) {
  const pct = total > 0 ? Math.round(current / total * 100) : 0;
  progressFill.style.width = pct + '%';
  let txt = running ? (paused ? `Paused ${current}/${total}` : `Processing ${current}/${total}`) : `${current}/${total}`;
  if (running && !paused && current > 0 && STATE.runStartTime) {
    const elapsed = (Date.now() - STATE.runStartTime) / 1000;
    if (elapsed > 0) {
      const rate = current / elapsed;
      const remaining = Math.max(0, total - current);
      const eta = rate > 0 ? remaining / rate : 0;
      txt += `  \u00b7  ${rate.toFixed(1)} img/s \u00b7 ~${fmtDuration(eta)} left`;
    }
  }
  progressText.textContent = txt;
}

function renderLogs() {
  if (STATE.logLines.length > 500) STATE.logLines = STATE.logLines.slice(-500);
  // escHtml on every line: log lines embed file names, and a name like
  // "<img src=x onerror=...>.png" (legal on Linux) must render as text.
  logBox.innerHTML = STATE.logLines.map(l => {
    let c = 'log-entry';
    if (l.indexOf('OK ') !== -1 || l.indexOf('\u2713') !== -1) c += ' ok';
    else if (l.indexOf('FAILED') !== -1 || l.indexOf('\u2717') !== -1) c += ' err';
    else if (l.startsWith('  ')) c += ' info';
    return `<div class="${c}">${escHtml(l)}</div>`;
  }).join('');
  logBox.scrollTop = logBox.scrollHeight;
}

function finalizeRun() {
  if (STATE.pollTimer) { clearInterval(STATE.pollTimer); STATE.pollTimer = null; }
  stopSSE();
  setRunButtons(false, false);
  if (STATE.results.length > 0) {
    STATE.wsName = STATE.files[0]?.thumbnail?.split('/')[3] || '';
    showResults();
    showPersistentNotice(`Compression complete! ${STATE.results.filter(r => r.success).length}/${STATE.results.length} files optimized.`, 'ok');
  } else {
    // e.g. cancelled before any file finished — nothing to show, but
    // Start still needs to become clickable again.
    updateStartButtonState();
  }
}

// Cancel
cancelBtn.addEventListener('click', async () => {
  await apiFetch('/api/cancel', { method: 'POST' });
});

// Pause / Resume (soft pause: new files stop scheduling, in-flight finish)
pauseBtn.addEventListener('click', async () => {
  await apiFetch('/api/pause', { method: 'POST' });
});
resumeBtn.addEventListener('click', async () => {
  await apiFetch('/api/resume', { method: 'POST' });
});

// Show results
function showResults() {
  resultsSection.classList.add('active');
  resultsEmpty.style.display = 'none';
  const results = STATE.results;
  const success = results.filter(r => r.success);
  const failed = results.filter(r => !r.success);

  // Summary
  const totalOrig = success.reduce((s, r) => s + r.original_size, 0);
  const totalComp = success.reduce((s, r) => s + r.compressed_size, 0);
  const saved = totalOrig - totalComp;
  const pct = totalOrig > 0 ? (saved / totalOrig * 100).toFixed(1) : 0;
  resultSummary.innerHTML = `
    <div class="result-stat">
      <div class="value accent">${results.length}</div>
      <div class="label">Files</div>
    </div>
    <div class="result-stat">
      <div class="value green">${pct}%</div>
      <div class="label">Compression</div>
    </div>
    <div class="result-stat">
      <div class="value accent">${fmtSize(totalOrig)}</div>
      <div class="label">Original</div>
    </div>
    <div class="result-stat">
      <div class="value green">${fmtSize(totalComp)}</div>
      <div class="label">Compressed</div>
    </div>
    <div class="result-stat">
      <div class="value accent">${fmtSize(saved)}</div>
      <div class="label">Saved</div>
    </div>
  `;

  // Sort/filter toolbar is only useful once there's something to sort.
  resultToolbar.style.display = results.length ? 'flex' : 'none';
  renderResultGrid();

  // Show output path info
  const outputDir = $('output-dir').value.trim();
  if (outputDir) {
    $('output-path-info').textContent = 'Output: ' + outputDir;
  } else {
    $('output-path-info').textContent = '';
  }

  // Enable download (any success) and Retry Failed (any failure).
  downloadBtn.style.display = success.length > 0 ? 'inline-block' : 'none';
  retryBtn.style.display = failed.length > 0 ? 'inline-block' : 'none';
  retryBtn.disabled = false;
  updateStartButtonState();
  progressText.textContent = 'Complete';
}

// Render the result cards applying the current filter then sort. Reads from
// STATE.results (never mutates it — default order must survive), so the
// toolbar can re-render instantly without re-fetching.
function renderResultGrid() {
  let rows = STATE.results.slice();
  if (STATE.resultFilter === 'success') rows = rows.filter(r => r.success);
  else if (STATE.resultFilter === 'failed') rows = rows.filter(r => !r.success);

  const savedBytes = r => (r.original_size || 0) - (r.compressed_size || 0);
  switch (STATE.resultSort) {
    case 'savings_desc': rows.sort((a, b) => (b.savings_percent || 0) - (a.savings_percent || 0)); break;
    case 'savings_asc': rows.sort((a, b) => (a.savings_percent || 0) - (b.savings_percent || 0)); break;
    case 'size_desc': rows.sort((a, b) => (b.compressed_size || 0) - (a.compressed_size || 0)); break;
    case 'saved_desc': rows.sort((a, b) => savedBytes(b) - savedBytes(a)); break;
    default: break; // 'default' keeps completion order
  }

  let html = '';
  for (const r of rows) {
    if (!r.success) {
      html += `
        <div class="result-card" style="opacity:.5">
          <div class="rname" title="${escHtml(r.name || '')}">✗ ${escHtml(r.name || '')}</div>
          <div class="rstats">${escHtml(r.error || 'Failed')}</div>
        </div>`;
      continue;
    }
    const previewUrl = `/api/preview/${STATE.wsName}/${r.id}`;
    const savedLine = r.skipped
      ? `<div class="rsaved">Skipped (already optimized)</div>`
      : `<div class="rsaved">Saved ${r.savings_percent}%</div>`;
    html += `
      <div class="result-card">
        <div class="rname" title="${escHtml(r.name)}">${escHtml(r.name)}</div>
        <div class="rstats">${fmtSize(r.original_size)} → ${fmtSize(r.compressed_size)}</div>
        ${savedLine}
        <a class="compare-btn" href="${previewUrl}" target="_blank">Compare</a>
      </div>`;
  }
  resultGrid.innerHTML = html;

  const total = STATE.results.length, shown = rows.length;
  resultCountEl.textContent = shown === total ? `${total} file(s)` : `${shown} of ${total} shown`;
}

resultSortSel.addEventListener('change', () => { STATE.resultSort = resultSortSel.value; renderResultGrid(); });
resultFilterSel.addEventListener('change', () => { STATE.resultFilter = resultFilterSel.value; renderResultGrid(); });

// Download
downloadBtn.addEventListener('click', async () => {
  const wsName = STATE.wsName;
  if (!wsName) return;
  const a = document.createElement('a');
  a.href = `/api/download/${wsName}`;
  a.download = 'optimized_images.zip';
  a.click();
});

// Reset
resetBtn.addEventListener('click', async () => {
  dismissPersistentNotice();
  resetScanUI();
  // Clear the server-side session too — otherwise the files/results stay
  // alive on the server and a page refresh (restoreState) resurrects them.
  try { await apiFetch('/api/reset', { method: 'POST' }); } catch(e) { /* best-effort */ }
  STATE.files = [];
  STATE.results = [];
  STATE.wsName = '';
  fileGrid.innerHTML = '';
  filesEmpty.textContent = 'Images will appear here after you scan a folder or add files';
  filesEmpty.style.display = '';
  resultGrid.innerHTML = '';
  resultSummary.innerHTML = '';
  resultsEmpty.style.display = '';
  fileStatsText.textContent = '';
  startBtn.disabled = true;
  fileCountInfo.textContent = '';
  downloadBtn.style.display = 'none';
  retryBtn.style.display = 'none';
  resultToolbar.style.display = 'none';
  resultCountEl.textContent = '';
  STATE.runStartTime = 0;
  STATE.resultCursor = 0;
  STATE.logCursor = 0;
  STATE.logLines = [];
  $('output-path-info').textContent = '';
  logBox.innerHTML = '';
  progressFill.style.width = '0%';
  progressText.textContent = 'Waiting...';
});

// Restore server-side session state after a page refresh — the server
// keeps files/results per session, but the UI used to come back blank
// (and /api/state sat unused). Also reattaches to a still-running batch.
async function restoreState() {
  try {
    const r = await fetch('/api/state');
    const d = await r.json();
    if (!d.files || !d.files.length) return;
    STATE.files = d.files;
    STATE.wsName = d.files[0]?.thumbnail?.split('/')[3] || '';
    if (d.input_dir) dirPath.value = d.input_dir;
    renderFiles();
    showConfigSection();
    if (d.is_running) {
      STATE.isRunning = true;
      // We didn't see this run start, so treat "now" as t0 for ETA. The
      // estimate will be rough until a few more files complete under our
      // own timing, then converge — good enough for a reattach.
      STATE.runStartTime = Date.now();
      // Reattaching mid-run: pull from the start so the first poll re-syncs
      // whatever results/logs already accumulated, then go incremental.
      STATE.resultCursor = 0;
      STATE.logCursor = 0;
      STATE.logLines = [];
      cancelBtn.style.display = '';
      updateStartButtonState();
      // Reattach via SSE (primary): a fresh EventSource replays from r0:l0
      // so the client re-syncs everything accumulated so far, then continues
      // live. Falls back to polling on failure/silence.
      startSSE();
    } else if (d.results && d.results.length) {
      STATE.results = d.results;
      showResults();
    }
  } catch(e) {
    // Fresh session or server unreachable — nothing to restore.
  }
}

// Init
applyStoredTheme();
loadConfig();
checkHealth();
loadRecentPaths();
updateModeDependentControls();

// Auto-scan from URL params
const params = new URLSearchParams(window.location.search);
const autoDir = params.get('dir');
if (autoDir) {
  dirPath.value = autoDir;
  scanBtn.click();
} else {
  restoreState();
}
</script>
