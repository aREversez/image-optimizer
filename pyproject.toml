[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "image-optimizer"
version = "1.0.0"
description = "Batch PNG compression with a local web UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.2",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
image-optimizer = "app.main:main"
